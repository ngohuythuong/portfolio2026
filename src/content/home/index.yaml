seo:
  title: "Ngô Huy Thường — UI/UX Designer Portfolio"
  # Bỏ trống description để dùng mô tả mặc định trong site/index.yaml

hero:
  heading: "Less talking More solving"
  image:
    src: "../../assets/images/avatar.webp"
    alt: "Portrait of Ngô Huy Thường, UI/UX designer"
  caption: "HUY THUONG NGO"

intro_video:
  src: "/assets/video/0407.mp4"
  poster: "/assets/images/intro-home-cover.webp"

mindset:
  overline: "The Mindset"
  text: "Complexity isn't my thing. I see UI/UX as a way to observe the world and distill it into seamless experiences. I'm a big believer that the best design is felt, not seen it should just work as naturally as breathing"
  cards:
    - title: "Obsession over\nobservation"
      text: "Being quiet is my superpower. While others talk, I'm busy 'decoding' the subtle cues. No guessing games just deep listening to what's not being said to build what's actually needed"
    - title: "Trim the fat.\nKeep the soul"
      text: "I'm literally 'allergic' to clutter. My job is to filter out the noise and keep the core vibes. A clean UI isn't just for the 'aesthetic' it's about giving users some breathing room to actually breathe"
      dark: true
    - title: "Built to scale,\nnot just to show"
      text: "Pretty is basic, but logic is what keeps them coming back. I don't do 'random' pixels. Every interaction is backed by a rock-solid Design System, making sure the product grows without breaking a sweat."

process:
  overline: "The Silent Process"
  heading: "Making Sense of It All"
  description: "A deep dive into pixels and patterns. Refining the chaos until only the essentials remain."
  steps:
    - title: "Listen"
      subtitle: "Understanding what isn't said."
      text: "I start by observing. I don't just take requirements; I listen to user pain points through data and behavior. Silence at this stage allows me to fully empathize with the problem before seeking the solution."
    - title: "Distill"
      subtitle: "Simplifying the complex"
      text: "This is where I decode raw data into logic. I strip away the noise to find the core value, building a clear Information Architecture and seamless User Flows. I believe the best solutions are the most refined ones."
    - title: "Craft"
      subtitle: "Precision in every pixel"
      text: "Once the logic is solid, I bring the product to life. I don't just design interfaces; I build scalable Design Systems. My focus is on creating a visual language that is not only beautiful but also functional and consistent."
    - title: "Optimize"
      subtitle: "Design is a living process"
      text: "A product's journey doesn't end at handoff. I observe how it lives in the real world, using usability testing and feedback to refine the smallest details. I ensure the experience stays smooth and effective over time."

works:
  overline: "SELECTED WORKS"
  heading: "Cool stuff I made"
  description: "Just me untangling complex vibes into clean designs. Poured a lot of heart into these"
  cta: { label: "View All", href: "/works" }
  # Số dự án hiển thị ở trang chủ
  limit: 3

behind:
  overline: "Behind the silence"
  text: "A quiet observer finding logic in the noise. Outside of pixels, I'm often found with a sketchbook or a cup of black coffee"
